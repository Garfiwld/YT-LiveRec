name: Renew live-notification subscriptions

on:
  schedule:
    - cron: "0 0 */5 * *" # every 5 days, well under the ~10 day PubSubHubbub expiry
  workflow_dispatch:

jobs:
  subscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Subscribe every channel to the worker
        env:
          CHANNELS: ${{ vars.CHANNELS }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: echo "$CHANNELS" | ./scripts/subscribe.sh "$WORKER_URL" "$WEBHOOK_SECRET"
