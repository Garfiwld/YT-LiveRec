name: Cleanup poll-live runs

# poll-live.yml fires every 10 minutes and its run history is pure noise
# once it's done — delete each run right after it completes. Has to be a
# separate workflow: GitHub won't let a run delete its own still-in-progress
# record, only ones that have already finished.
on:
  workflow_run:
    workflows: ["Poll for live streams"]
    types: [completed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the completed poll-live.yml run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
