name: Test WARP split proxy

on:
  workflow_dispatch:
    inputs:
      url:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install and connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 3

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Extract a real segment URL via WARP, then test fetching it with and without WARP
        run: |
          manifesturl=$(yt-dlp --no-warnings --proxy socks5://127.0.0.1:40000 -j "${{ inputs.url }}" | python3 -c "import json,sys; print(json.load(sys.stdin)['formats'][0]['url'])")
          echo "manifest url: $manifesturl" | cut -c1-100

          segmenturl=$(curl -s --proxy socks5://127.0.0.1:40000 "$manifesturl" | grep -m1 "^https")
          echo "segment url: $segmenturl" | cut -c1-100

          echo "--- via WARP proxy ---"
          curl -s -o /dev/null -w "HTTP %{http_code}, %{size_download} bytes\n" --proxy socks5://127.0.0.1:40000 --max-time 10 -r 0-100000 "$segmenturl"

          echo "--- direct, no proxy (runner's own IP) ---"
          curl -s -o /dev/null -w "HTTP %{http_code}, %{size_download} bytes\n" --max-time 10 -r 0-100000 "$segmenturl"
