name: Upload recording to YouTube

on:
  repository_dispatch:
    types: [recording-ready]

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: yt-liverec-recordings
    steps:
      - uses: actions/checkout@v4

      - name: Install YouTube upload libs
        run: pip install -U google-api-python-client google-auth

      - name: Download recording from R2
        run: |
          mkdir -p downloads
          aws s3 cp "s3://${R2_BUCKET}/${{ github.event.client_payload.key }}" \
            "downloads/${{ github.event.client_payload.key }}" --endpoint-url "$R2_ENDPOINT"

      - name: Upload to YouTube as private
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          filepath="downloads/${{ github.event.client_payload.key }}"
          python3 scripts/upload_youtube.py "$filepath" "$(basename "${filepath%.*}")"

      - name: Delete the recording from R2 now that it's on YouTube
        run: aws s3 rm "s3://${R2_BUCKET}/${{ github.event.client_payload.key }}" --endpoint-url "$R2_ENDPOINT"
