name: Upload recording to YouTube

on:
  repository_dispatch:
    types: [recording-ready]

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: yt-liverec-recordings
    steps:
      - uses: actions/checkout@v4

      - name: Install YouTube upload libs
        run: pip install -U google-api-python-client google-auth

      - name: Download recording from R2
        run: |
          mkdir -p downloads
          npx wrangler r2 object get "${R2_BUCKET}/${{ github.event.client_payload.key }}" \
            --file="downloads/${{ github.event.client_payload.key }}" --remote

      - name: Upload to YouTube as private
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          filepath="downloads/${{ github.event.client_payload.key }}"
          python3 scripts/upload_youtube.py "$filepath" "$(basename "${filepath%.*}")"

      - name: Delete the recording from R2 now that it's on YouTube
        run: npx wrangler r2 object delete "${R2_BUCKET}/${{ github.event.client_payload.key }}" --remote
