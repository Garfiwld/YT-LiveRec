name: Record live streams (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      handles: ${{ steps.list.outputs.handles }}
    steps:
      - id: list
        env:
          CHANNELS: ${{ vars.CHANNELS }}
        run: |
          handles=$(echo "$CHANNELS" | grep -v '^#' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "handles=$handles" >> "$GITHUB_OUTPUT"

  record:
    needs: discover
    runs-on: ubuntu-latest
    concurrency:
      group: record-${{ matrix.handle }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        handle: ${{ fromJson(needs.discover.outputs.handles) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Check channel, record if live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check_and_record.sh "https://www.youtube.com/${{ matrix.handle }}/live"
