name: Poll for live streams

# Detection only — no recording here. Checks each channel and, if live,
# dispatches a "youtube-live" event that notify-live.yml (the same one
# the Cloudflare Worker webhook fires) picks up and records.
# Triggered externally on a schedule by cron-job.org (POST to this
# workflow's /dispatches API) instead of GitHub's own `schedule:`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      handles: ${{ steps.list.outputs.handles }}
    steps:
      - id: list
        env:
          CHANNELS: ${{ vars.CHANNELS }}
        run: |
          handles=$(echo "$CHANNELS" | grep -v '^#' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "handles=$handles" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        handle: ${{ fromJson(needs.discover.outputs.handles) }}
    steps:
      - name: Install and connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 3
          warp-cli --accept-tos status

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Check channel, dispatch if live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://www.youtube.com/${{ matrix.handle }}/live"
          max_attempts=3
          attempt=1
          info=""
          while [ "$attempt" -le "$max_attempts" ]; do
            if info=$(yt-dlp --no-warnings --proxy socks5://127.0.0.1:40000 -j "$url"); then
              break
            fi
            echo "check attempt $attempt/$max_attempts failed, reconnecting WARP for a new IP..."
            sudo warp-cli --accept-tos disconnect
            sleep 2
            sudo warp-cli --accept-tos connect
            sleep 3
            attempt=$((attempt + 1))
          done
          if [ -z "$info" ]; then
            echo "not available after $max_attempts attempts, skipping"
            exit 0
          fi
          is_live=$(echo "$info" | python3 -c "import json,sys; print(json.load(sys.stdin).get('is_live'))")
          if [ "$is_live" != "True" ]; then
            echo "not live, skipping"
            exit 0
          fi

          video_id=$(echo "$info" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "live! dispatching $video_id"
          echo "{\"event_type\":\"youtube-live\",\"client_payload\":{\"video_id\":\"$video_id\"}}" \
            | gh api "repos/${{ github.repository }}/dispatches" --input -
